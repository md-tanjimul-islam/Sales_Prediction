services:
  - type: web
    name: codealpha-sales-prediction
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.train
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
